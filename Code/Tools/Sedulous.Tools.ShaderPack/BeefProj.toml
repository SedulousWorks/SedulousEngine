FileVersion = 1

[Project]
Name = "Sedulous.Tools.ShaderPack"
TargetType = "BeefConsoleApplication"
StartupObject = "Sedulous.Tools.ShaderPack.Program"

[Dependencies]
corlib = "*"
"Sedulous.Core" = "*"
"Sedulous.Shaders" = "*"
"Dxc-Beef" = "*"

# naga and tint go BESIDE the executable, which is where ShaderPackCooker looks for them:
# it resolves the running binary's directory rather than taking a configured path, so a
# tool that is not sitting next to them silently produces no WGSL.
[Configs.Debug.Linux64]
PostBuildCmds = ["CopyToDependents(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToDependents(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")"]

[Configs.Release.Linux64]
PostBuildCmds = ["CopyToDependents(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToDependents(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")"]
