FileVersion = 1

[Project]
Name = "Sedulous.Tools.ShaderPack"
TargetType = "BeefConsoleApplication"
StartupObject = "Sedulous.Tools.ShaderPack.Program"

[Dependencies]
corlib = "*"
"Sedulous.Core" = "*"
"Sedulous.Shaders" = "*"
"Dxc-Beef" = "*"

# naga and tint go BESIDE the executable, which is where ShaderPackCooker looks for them:
# it resolves the running binary's directory rather than taking a configured path, so a
# tool that is not sitting next to them silently produces no WGSL.
[Configs.Debug.Linux64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")", "ExecuteRaw(\"chmod +x $(TargetDir)/naga $(TargetDir)/tint\")"]

[Configs.Debug.Win64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/win-x64/naga.exe\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/win-x64/tint.exe\")"]

[Configs.Release.Linux64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")", "ExecuteRaw(\"chmod +x $(TargetDir)/naga $(TargetDir)/tint\")"]

[Configs.Release.Win64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/win-x64/naga.exe\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/win-x64/tint.exe\")"]
