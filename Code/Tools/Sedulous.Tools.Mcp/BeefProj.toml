FileVersion = 1

[Project]
Name = "Sedulous.Tools.Mcp"
TargetType = "BeefConsoleApplication"
StartupObject = "Sedulous.Tools.Mcp.Program"

[Dependencies]
corlib = "*"
"Sedulous.Core" = "*"
"Sedulous.Json" = "*"
"Sedulous.Mcp" = "*"
"Sedulous.Mcp.Reflection" = "*"
"Sedulous.Mcp.Script" = "*"
"Sedulous.Content" = "*"
"Sedulous.VFS" = "*"
"Sedulous.Pipeline.Core" = "*"
"Sedulous.Pipeline.Importer" = "*"
"Sedulous.Pipeline.Registration" = "*"
"Sedulous.Engine.SceneSurface" = "*"
"Sedulous.Editor.Core" = "*"
"Sedulous.Editor.Mcp" = "*"

# The WGSL shader cook a Web export runs needs naga and tint BESIDE the executable, where
# ShaderPackCooker looks for them, exactly as Tools.ShaderPack ships them.
[Configs.Debug.Linux64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")", "ExecuteRaw(\"chmod +x $(TargetDir)/naga $(TargetDir)/tint\")"]

[Configs.Debug.Win64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/win-x64/naga.exe\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/win-x64/tint.exe\")"]

[Configs.Release.Linux64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")", "ExecuteRaw(\"chmod +x $(TargetDir)/naga $(TargetDir)/tint\")"]

[Configs.Release.Win64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/win-x64/naga.exe\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/win-x64/tint.exe\")"]
