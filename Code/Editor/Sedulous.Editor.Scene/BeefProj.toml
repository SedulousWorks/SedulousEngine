# On the GUI in parts (Raptor's editor-gui spec, 5.3): its UI-free half and the page build. The
# inspector and the two picker dialogs are still on Sedulous.UI; they stay out of the compile,
# their sources unedited, until their layers.
[ProjectFolder]

[[ProjectFolder.Items]]
Type = "AutoFolder"
Name = "Hierarchy"

