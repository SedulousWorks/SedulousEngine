FileVersion = 1

[Project]
Name = "Sedulous.Http.Client"
TargetType = "BeefLib"
StartupObject = "Sedulous.Http.Client.Program"

[Dependencies]
corlib = "*"
"Sedulous.Core" = "*"
"Sedulous.Http" = "*"
"Sedulous.Net" = "*"
"Sedulous.Net.Tls" = "*"

# The browser client calls emscripten's fetch, which is in the link only when asked for.
[Configs.Debug.wasm32]
OtherLinkFlags = "-sFETCH=1"

[Configs.Release.wasm32]
OtherLinkFlags = "-sFETCH=1"

[Configs.ShippingRelease.wasm32]
OtherLinkFlags = "-sFETCH=1"
