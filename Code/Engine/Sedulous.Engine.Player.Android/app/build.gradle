plugins {
    id 'com.android.application' version '8.11.1' apply false
}

// What Tools/android-app.sh staged (jniLibs, assets) and where the build goes: outside the source
// tree, so the checkout holds only this project's sources.
def staged = file(providers.gradleProperty('sedulousStaged').get())
allprojects {
    layout.buildDirectory = new File(staged, "gradle/${project.name}")
}
