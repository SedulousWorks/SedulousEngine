FileVersion = 1

[Project]
Name = "Sedulous.Integration.Mcp"
TargetType = "BeefTest"
StartupObject = "Sedulous.Integration.Mcp.Program"

[Dependencies]
corlib = "*"
"Sedulous.Core" = "*"
"Sedulous.Json" = "*"
"Sedulous.Mcp" = "*"
"Sedulous.Mcp.Reflection" = "*"
"Sedulous.Mcp.Script" = "*"
"Sedulous.Content" = "*"
"Sedulous.VFS" = "*"
"Sedulous.Scene" = "*"
"Sedulous.Scene.Resource" = "*"
"Sedulous.Net.Replication" = "*"
"Sedulous.Engine.Render" = "*"
"Sedulous.Engine.SceneSurface" = "*"
"Sedulous.Engine.Project" = "*"
"Sedulous.Pipeline.Core" = "*"
"Sedulous.Pipeline.Importer" = "*"
"Sedulous.Pipeline.Registration" = "*"
"Sedulous.Texture.Pipeline" = "*"
"Sedulous.Materials.Pipeline" = "*"
"Sedulous.Audio.Pipeline" = "*"
"Sedulous.Script.Pipeline" = "*"
"Sedulous.Editor.Core" = "*"
"Sedulous.Editor.Mcp" = "*"

# A Web export's WGSL cook needs naga and tint beside the executable.
[Configs.Test.Linux64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/linux-x86_64/naga\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/linux-x86_64/tint\")", "ExecuteRaw(\"chmod +x $(TargetDir)/naga $(TargetDir)/tint\")"]

[Configs.Test.Win64]
PostBuildCmds = ["CopyToTarget(\"$(WorkspaceDir)/../Bin/Naga/bin/win-x64/naga.exe\")", "CopyToTarget(\"$(WorkspaceDir)/../Bin/Tint/bin/win-x64/tint.exe\")"]
