FileVersion = 1

[Project]
Name = "mbedtls-Beef"
TargetType = "BeefLib"
StartupObject = "mbedtls_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/mbedtls-c.lib", "bcrypt.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/mbedtls-c.lib", "bcrypt.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/mbedtls-c.lib", "bcrypt.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmbedtls-c.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmbedtls-c.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmbedtls-c.a"]

[Configs.ShippingRelease.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/mbedtls-c.lib", "bcrypt.lib"]

[Configs.ShippingRelease.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmbedtls-c.a"]

# No wasm32 archive: a browser does TLS itself (Http.Client's fetch, the browser's WebSocket), and
# Sedulous.Net.Tls.MbedTLS, the one project over this, is compiled out of a wasm build, so nothing
# there links it. `build-native.sh wasm` still builds one, for a wasm user that ever needs it.
