FileVersion = 1

[Project]
Name = "sheenbidi-Beef"
TargetType = "BeefLib"
StartupObject = "sheenbidi_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/sheenbidi.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/sheenbidi.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/sheenbidi.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libsheenbidi.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libsheenbidi.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libsheenbidi.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libsheenbidi.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libsheenbidi.a"]

[Configs.ShippingRelease.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/sheenbidi.lib"]

[Configs.ShippingRelease.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libsheenbidi.a"]

[Configs.ShippingRelease.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libsheenbidi.a"]
