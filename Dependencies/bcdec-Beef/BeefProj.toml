FileVersion = 1

[Project]
Name = "bcdec-Beef"
TargetType = "BeefLib"
StartupObject = "bcdec_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/bcdec-c.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/bcdec-c.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/bcdec-c.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libbcdec-c.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libbcdec-c.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libbcdec-c.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libbcdec-c.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libbcdec-c.a"]
