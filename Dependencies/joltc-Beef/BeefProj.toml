FileVersion = 1

[Project]
Name = "joltc-Beef"
TargetType = "BeefLib"
StartupObject = "joltc_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/joltcd.lib", "$(ProjectDir)/dist/Debug-Win64/joltd.lib"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Debug-Win64/*.dll\")", "CopyToDependents(\"$(ProjectDir)/dist/Debug-Win64/*.pdb\")"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/joltc.lib", "$(ProjectDir)/dist/Release-Win64/jolt.lib"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Release-Win64/*.dll\")", "CopyToDependents(\"$(ProjectDir)/dist/Release-Win64/*.pdb\")"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/joltcd.lib", "$(ProjectDir)/dist/Debug-Win64/joltd.lib"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Debug-Win64/*.dll\")", "CopyToDependents(\"$(ProjectDir)/dist/Debug-Win64/*.pdb\")"]
[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libjoltc.so"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Release-Linux64/*.so\")"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libjoltc.so"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Release-Linux64/*.so\")"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libjoltc.so"]
PostBuildCmds = ["CopyToDependents(\"$(ProjectDir)/dist/Release-Linux64/*.so\")"]

# wasm32 links the STATIC archive and copies nothing: there is no shared library to place
# beside an executable, so the PostBuildCmds the native configs carry have no counterpart.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libjoltc.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libjoltc.a"]
