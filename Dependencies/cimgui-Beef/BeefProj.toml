FileVersion = 1

[Project]
Name = "cimgui-Beef"
TargetType = "BeefLib"
StartupObject = "cimgui_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/cimgui.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/cimgui.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/cimgui.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcimgui.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcimgui.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcimgui.a"]

[Configs.ShippingRelease.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/cimgui.lib"]

[Configs.ShippingRelease.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcimgui.a"]

# wasm32, built by `build-native.sh wasm`. Wasm has no shared libraries, so Debug and Release both
# link the Release build of the third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libcimgui.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libcimgui.a"]

[Configs.ShippingRelease.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libcimgui.a"]
