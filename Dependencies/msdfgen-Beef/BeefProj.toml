FileVersion = 1

[Project]
Name = "msdfgen-Beef"
TargetType = "BeefLib"
StartupObject = "msdfgen_Beef.Program"

# The wrapper comes first: it references msdfgen-core, and a static link resolves left to
# right.

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/msdfgen-c.lib", "$(ProjectDir)/dist/Debug-Win64/msdfgen-core.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/msdfgen-c.lib", "$(ProjectDir)/dist/Release-Win64/msdfgen-core.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/msdfgen-c.lib", "$(ProjectDir)/dist/Debug-Win64/msdfgen-core.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmsdfgen-c.a", "$(ProjectDir)/dist/Release-Linux64/libmsdfgen-core.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmsdfgen-c.a", "$(ProjectDir)/dist/Release-Linux64/libmsdfgen-core.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmsdfgen-c.a", "$(ProjectDir)/dist/Release-Linux64/libmsdfgen-core.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libmsdfgen-c.a", "$(ProjectDir)/dist/Release-wasm32/libmsdfgen-core.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libmsdfgen-c.a", "$(ProjectDir)/dist/Release-wasm32/libmsdfgen-core.a"]
