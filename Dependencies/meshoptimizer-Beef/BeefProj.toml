FileVersion = 1

[Project]
Name = "meshoptimizer-Beef"
TargetType = "BeefLib"
StartupObject = "meshoptimizer_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/meshoptimizer.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/meshoptimizer.lib"]

[Configs.Test.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/meshoptimizer.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmeshoptimizer.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmeshoptimizer.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libmeshoptimizer.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libmeshoptimizer.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libmeshoptimizer.a"]
