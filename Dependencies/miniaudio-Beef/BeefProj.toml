FileVersion = 1
Dependencies = {corlib = "*"}

[Project]
Name = "miniaudio-Beef"
TargetType = "BeefLib"
StartupObject = "miniaudio_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/miniaudio.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/miniaudio.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libminiaudio.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libminiaudio.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libminiaudio.a"]

# wasm32 has no shared libraries, so this is the static archive built by
# `build-native.sh wasm`. Debug and Release link the same one: it is a Release build of a
# third party library, which the engine does not debug through.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libminiaudio.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libminiaudio.a"]
