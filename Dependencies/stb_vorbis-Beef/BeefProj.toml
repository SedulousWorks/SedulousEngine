FileVersion = 1

[Project]
Name = "stb_vorbis-Beef"
TargetType = "BeefLib"
StartupObject = "stb_vorbis.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/stb_vorbis.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/stb_vorbis.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libstb_vorbis.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libstb_vorbis.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libstb_vorbis.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libstb_vorbis.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libstb_vorbis.a"]
