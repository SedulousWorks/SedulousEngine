FileVersion = 1

[Project]
Name = "cgltf-Beef"
TargetType = "BeefLib"
StartupObject = "cgltf_Beef.Program"

[Configs.Debug.Win64]
LibPaths = ["$(ProjectDir)/dist/Debug-Win64/cgltf.lib"]

[Configs.Release.Win64]
LibPaths = ["$(ProjectDir)/dist/Release-Win64/cgltf.lib"]

[Configs.Debug.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcgltf.a"]

[Configs.Release.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcgltf.a"]

[Configs.Test.Linux64]
LibPaths = ["$(ProjectDir)/dist/Release-Linux64/libcgltf.a"]

# wasm32, built by `build-native.sh wasm`. One archive per platform library; wasm has no
# shared libraries, so Debug and Release both link the Release build of a third party.
[Configs.Debug.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libcgltf.a"]

[Configs.Release.wasm32]
LibPaths = ["$(ProjectDir)/dist/Release-wasm32/libcgltf.a"]
